# Coturn configuration file for Copio Relay (CPO-092)
# Reference: https://github.com/coturn/coturn

# Listening ports
listening-port=3478
tls-listening-port=5349
alt-listening-port=0
alt-tls-listening-port=0

# Listening IPs (0.0.0.0 listens on all available interfaces)
listening-ip=0.0.0.0

# Realm used for authentication
realm=copio

# Enable long-term credential mechanism & HMAC secret authentication
lt-cred-mech
use-auth-secret
static-auth-secret=copio_turn_secret_change_me

# Relay port allocation range (ensure this UDP range is open in host firewall)
min-port=49152
max-port=65535

# Fingerprint in TURN messages (required by WebRTC RFC 5766)
fingerprint

# Bandwidth and rate limiting
total-quota=100
bps-capacity=0
stale-nonce=600

# Security options: disallow CLI and multicast peers
no-cli
no-multicast-peers
no-loopback-peers
no-tcp-relay
verbose
