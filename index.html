<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, maximum-scale=1.0, user-scalable=no, minimal-ui, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Offline first image and document scanner"
    />
    <meta property="og:title" content="Copio" />
    <meta name="theme-color" content="#151F2A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="icon" href="copio.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/shoelace.css" />
    <link rel="stylesheet" href="css/utils.css" />
    <link rel="stylesheet" href="css/cropper.css" />
    <link rel="stylesheet" href="css/main.css" />
    <title>COPIO</title>
  </head>
  <body>
    <copio-app></copio-app>

    <script type="module" src="js/lib/shoelace.js"></script>
    <script type="module" src="js/core/register-components.js"></script>
    <script type="module">
      import { notify } from './js/services/notify.js';

      // set to false if testing SW locally
      // http://192.168.x.x:3000 won't work as only localhost works this SWs or SSL is needed
      const isDev = window.location.hostname === 'localhost';
      if (!isDev && 'serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');

        // Capture whether a SW was already controlling this page at load time.
        // If not (fresh install or post-unregister reload), we don't show the toast.
        const hadController = !!navigator.serviceWorker.controller;

        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!hadController) return;
          notify.info('Update available', {
            icon: 'arrow-clockwise',
            duration: Infinity,
            action: {
              text: 'Reload',
              onClick: () => window.location.reload(),
            },
          });
        });
      }
    </script>
  </body>
</html>
