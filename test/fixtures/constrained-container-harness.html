<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Copio Scanner Constrained Container Test Harness (CPO-024)</title>
    <link rel="stylesheet" href="../../css/reset.css" />
    <link rel="stylesheet" href="../../css/shoelace.css" />
    <link rel="stylesheet" href="../../css/container.css" />
    <link rel="stylesheet" href="../../css/utils.css" />
    <link rel="stylesheet" href="../../css/cropper.css" />
    <link rel="stylesheet" href="../../css/main.css" />
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #070a0f;
        color: #f1f5f9;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
      }

      .harness-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 16px;
        background: #111827;
        border-bottom: 1px solid #1f2937;
        flex-shrink: 0;
        z-index: 100;
      }

      .harness-title {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.05em;
        color: #38bdf8;
      }

      .harness-btn-group {
        display: flex;
        gap: 6px;
      }

      .harness-btn {
        background: #1f2937;
        color: #e5e7eb;
        border: 1px solid #374151;
        border-radius: 6px;
        padding: 6px 12px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        min-height: 36px;
        transition: all 0.15s ease;
      }

      .harness-btn:hover {
        background: #374151;
        border-color: #4b5563;
      }

      .harness-btn.active {
        background: #0284c7;
        border-color: #38bdf8;
        color: white;
      }

      .harness-stage {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        overflow: hidden;
        background: radial-gradient(circle at center, #1e293b 0%, #070a0f 100%);
      }

      .host-container-frame {
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(56, 189, 248, 0.25);
        border-radius: 12px;
        overflow: hidden;
        background: #fff;
        transition: width 0.2s ease, height 0.2s ease;
      }

      .host-container-frame[data-size="full"] {
        border-radius: 0;
        box-shadow: none;
      }
    </style>
  </head>
  <body>
    <header class="harness-toolbar">
      <div class="harness-title">COPIO CONTAINER TEST HARNESS (CPO-024)</div>
      <div class="harness-btn-group" id="size-switcher">
        <button class="harness-btn active" data-size="360x640">360×640 (Modal)</button>
        <button class="harness-btn" data-size="480x800">480×800 (Drawer)</button>
        <button class="harness-btn" data-size="400x800">400×800 (Narrow)</button>
        <button class="harness-btn" data-size="800x500">800×500 (Landscape)</button>
        <button class="harness-btn" data-size="full">100% (Full View)</button>
      </div>
    </header>

    <main class="harness-stage">
      <div class="host-container-frame" id="container-frame" data-size="360x640">
        <copio-app></copio-app>
      </div>
    </main>

    <script type="module" src="../../js/lib/shoelace.js"></script>
    <script type="module" src="../../js/core/register-components.js"></script>
    <script type="module">
      const frame = document.getElementById('container-frame');
      const buttons = document.querySelectorAll('#size-switcher button');

      buttons.forEach((btn) => {
        btn.addEventListener('click', () => {
          buttons.forEach((b) => b.classList.remove('active'));
          btn.classList.add('active');
          const size = btn.getAttribute('data-size');
          frame.setAttribute('data-size', size);
        });
      });
    </script>
  </body>
</html>
